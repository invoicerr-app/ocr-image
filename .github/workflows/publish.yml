name: Publish OCR image

# Builds the OCR image, smoke-tests /health on a real container, then pushes it to
# ghcr.io/invoicerr-app/ocr-image. Runs on every push to main, on version tags, and on demand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/invoicerr-app/ocr-image

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU lets the amd64 runner build and run the arm64 variant.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once, load into the local daemon so the smoke test runs the EXACT image we will push.
      - name: Build (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ocr-image:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      # A real container must answer /health before anything is published — never push a broken image.
      - name: Smoke test — /health
        run: |
          docker run -d --name ocr -p 9998:9998 ocr-image:ci
          ok=""
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:9998/health >/tmp/h.json 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs ocr || true
          test -n "$ok" || { echo "::error::container never became healthy"; exit 1; }
          cat /tmp/h.json
          # Tolerate JSON spacing ("status": "ok") — Python's json.dumps uses ": " by default.
          grep -qE '"status":[[:space:]]*"ok"' /tmp/h.json
          grep -qE '"engine":[[:space:]]*"ocrmypdf"' /tmp/h.json
          docker rm -f ocr

      # Same check on arm64, run under QEMU: a multi-arch push must not ship an untested variant.
      - name: Build arm64 (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ocr-image:ci-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Smoke test — /health (arm64)
        run: |
          docker run -d --platform linux/arm64 --name ocr -p 9998:9998 ocr-image:ci-arm64
          ok=""
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:9998/health >/tmp/h.json 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs ocr || true
          test -n "$ok" || { echo "::error::container never became healthy"; exit 1; }
          cat /tmp/h.json
          # Tolerate JSON spacing ("status": "ok") — Python's json.dumps uses ": " by default.
          grep -qE '"status":[[:space:]]*"ok"' /tmp/h.json
          grep -qE '"engine":[[:space:]]*"ocrmypdf"' /tmp/h.json
          docker rm -f ocr

      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # One cache scope per arch, otherwise the second build's export overwrites the first's.
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
