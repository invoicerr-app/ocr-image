name: Publish OCR image

# Builds the OCR image natively per architecture (amd64 + arm64 runners, in parallel), smoke-tests
# /health on a real container of each, then publishes one multi-arch manifest to
# ghcr.io/invoicerr-app/ocr-image. Runs on every push to main, on version tags, and on demand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/invoicerr-app/ocr-image

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once, load into the local daemon so the smoke test runs the EXACT image we will push.
      - name: Build (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ocr-image:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # A real container must answer /health before anything is published — never push a broken image.
      - name: Smoke test — /health
        run: |
          docker run -d --name ocr -p 9998:9998 ocr-image:ci
          ok=""
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:9998/health >/tmp/h.json 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs ocr || true
          test -n "$ok" || { echo "::error::container never became healthy"; exit 1; }
          cat /tmp/h.json
          # Tolerate JSON spacing ("status": "ok") — Python's json.dumps uses ": " by default.
          grep -qE '"status":[[:space:]]*"ok"' /tmp/h.json
          grep -qE '"engine":[[:space:]]*"ocrmypdf"' /tmp/h.json
          docker rm -f ocr

      # Pushed by digest only (no tag); the merge job below ties both digests into one manifest.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:$GITHUB_SHA" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
